version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: pgvector/pgvector:pg16
    container_name: pruebas-database
    environment:
      POSTGRES_DB: growagentai
      POSTGRES_USER: growagentai_user
      POSTGRES_PASSWORD: secure_password_change_this
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growagentai_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - growagentai-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pruebas-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - growagentai-network

  # GrowAgentAI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pruebas-backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://growagentai_user:secure_password_change_this@database:5432/growagentai
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: development
      PORT: 3001
      LOG_LEVEL: debug
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - growagentai-network

volumes:
  postgres_data:

networks:
  growagentai-network:
    driver: bridge
