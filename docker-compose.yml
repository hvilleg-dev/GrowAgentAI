version: '3.8'

services:
  # GrowAgentAI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: growagentai-backend
    ports:
      - "3001:3001"
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL}

      # API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # GitHub OAuth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}

      # Frontend
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}

      # App Config
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info

      # Sentry (optional)
      SENTRY_DSN: ${SENTRY_DSN:-}

    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits (adjust for your VM)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Network
    networks:
      - growagentai-network

networks:
  growagentai-network:
    driver: bridge
