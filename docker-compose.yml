version: '3.8'

services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: growagentai_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_this}
      POSTGRES_DB: growagentai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growagentai_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - growagentai_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - growagentai_network

  backend:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://growagentai_user:${DB_PASSWORD:-secure_password_change_this}@database:5432/growagentai
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PORT: ${PORT:-3000}
      API_PORT: ${API_PORT:-3001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - growagentai_network

volumes:
  postgres_data:

networks:
  growagentai_network:
    driver: bridge
